<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Shift Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .custom-container {
            max-width: 800px;
        }
    </style>
</head>
<body>

     <nav class="navbar navbar-expand-lg bg-light"> <!--Navigation bar that collapses into icon-->

    <div class="container">
      <a class="navbar-brand text-#f14d24" href="index.html" id="title">Crust & Crumb</a>

      <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#marketNav"
            aria-controls="marketNav" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>


      <div class="collapse navbar-collapse" id="marketNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html">Daily Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="checkout form.html">Inventory</a></li>
          </ul>
        </div>
    </div>
  </nav>
          
<!-- Inventory Form -->

<div class="container mt-5">

  <h1>Inventory & Shift Form</h1>
  <p>Enter today's bakery inventory information.</p>

  <form class="inventory-form">

    <div class="mb-3">
      <label class="form-label">Baker Name</label>
      <input type="text" class="form-control" placeholder="Enter baker name" required>
    </div>
    <!-- Shift -->
    <div class="mb-3">
      <label class="form-label">Shift</label>

      <select class="form-select" required>
        <option value="">Choose shift</option>
        <option>Morning - 4 AM</option>
        <option>Afternoon - 1 PM</option>
      </select>

    </div>
    <div class="mb-3">
      <label class="form-label">Pastry Name</label>
      <input type="text" class="form-control" placeholder="Enter pastry name" required>
    </div>
    <!-- Quantity -->
    <div class="mb-3">
      <label class="form-label">Daily Quantity</label>
      <input type="number" class="form-control" placeholder="Enter daily quantity" required>
    </div>
    <button type="submit" class="btn btn-primary">
      Submit
    </button>

  </form>

</div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
